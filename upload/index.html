<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор палубной загрузки</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="sidebar">
        <h2>🚢 Палубный калькулятор</h2>

        <div class="vessel-selector">
            <h3>Тип судна</h3>
            <select id="vessel-type" onchange="changeVessel()">
                <option value="aframax">Танкер Афрамакс (245×42м)</option>
                <option value="panamax">Танкер Панамакс (230×32м)</option>
                <option value="supply">Снабженческое (85×20м)</option>
                <option value="platform">Платформа Ж/Б (80×60м)</option>
                <option value="cargo_model">🎨 Cargo Vessel (3D-модель)</option>
                <option value="multipurpose_model">🎨 Multi-purpose Vessel VII (3D-модель)</option>
                <option value="custom">Пользовательский</option>
            </select>
        </div>

        <div class="cargo-form" id="model-calibration" style="display:none;">
            <h3>🛠️ Калибровка 3D-модели</h3>
            <div id="model-progress" style="font-size:12px;color:#81d4fa;margin-bottom:6px;"></div>
            <div class="row">
                <input type="number" id="cal-scale" placeholder="Масштаб" step="0.01" value="1">
                <input type="number" id="cal-rotation" placeholder="Поворот Y (°)" step="1" value="0">
            </div>
            <div class="row">
                <input type="number" id="cal-x" placeholder="Смещение X (м)" step="0.5" value="0">
                <input type="number" id="cal-z" placeholder="Смещение Z (м)" step="0.5" value="0">
            </div>
            <input type="number" id="cal-y" placeholder="Высота палубы Y (м)" step="0.1" value="0">
            <button class="btn btn-primary" onclick="applyCalibration()">Применить</button>
            <button class="btn btn-secondary" onclick="saveCalibration()">Сохранить для этого судна</button>
        </div>

        <div class="cargo-form">
            <h3>➕ Добавить груз</h3>
            <input type="text" id="cargo-name" placeholder="Название груза" value="Контейнер 20фт">
            <div class="row">
                <input type="number" id="cargo-mass" placeholder="Масса (т)" step="0.1" value="25">
                <input type="number" id="cargo-length" placeholder="Длина (м)" step="0.1" value="6.06">
            </div>
            <div class="row">
                <input type="number" id="cargo-width" placeholder="Ширина (м)" step="0.1" value="2.44">
                <input type="number" id="cargo-height" placeholder="Высота (м)" step="0.1" value="2.59">
            </div>
            <div class="row">
                <input type="number" id="cargo-x" placeholder="X от ЦД (м)" step="0.1" value="0">
                <input type="number" id="cargo-y" placeholder="Y от ДП (м)" step="0.1" value="0">
            </div>
            <input type="number" id="cargo-z" placeholder="Высота ЦТ груза (м)" step="0.1" value="1.3">
            <button class="btn btn-primary" onclick="addCargo()">Добавить груз</button>
            <button class="btn btn-secondary" onclick="clearAll()">Очистить всё</button>
        </div>

        <div id="cargo-list"></div>

        <div class="result-box">
            <h3>📊 Расчёты</h3>
            <div id="results">Добавьте грузы для расчёта</div>
        </div>

        <div class="result-box warnings" id="warnings" style="display:none;">
            <h3>⚠️ Предупреждения</h3>
            <div id="warning-list"></div>
        </div>
    </div>

    <div id="canvas-container">
        <div id="viewport"></div>
        <div id="overlay">
            <div class="legend">
                <span class="legend-item"><span class="color-box ok"></span> Норма</span>
                <span class="legend-item"><span class="color-box warning"></span> 80%+</span>
                <span class="legend-item"><span class="color-box danger"></span> Перегруз</span>
            </div>
            <div class="controls-hint">
                🖱️ ЛКМ на пустом месте — вращение камеры<br>
                🖱️ ПКМ — перемещение камеры | Колёсико — зум<br>
                ✋ Зажать ЛКМ на грузе и тащить — переместить груз
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="js/calculator.js"></script>
    <script src="js/scene.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
